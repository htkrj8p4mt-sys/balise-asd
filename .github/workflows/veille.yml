name: Veille

on:
  schedule:
    - cron: "17 * * * *"    # collecte toutes les heures
    - cron: "37 5 * * 1"    # synthèse de l'état des lieux chaque lundi
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Collecter
        run: python scripts/collect.py
      - name: Mettre à jour la synthèse
        if: github.event.schedule == '37 5 * * 1'
        run: python scripts/collect.py --overview
      - name: Enregistrer et publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site scripts
          if ! git diff --cached --quiet; then
            git commit -m "Veille : mise à jour automatique"
            git push
            # Publication séparée : GitHub Pages doit recevoir le nouveau commit.
            gh workflow run publication.yml --ref main
          fi
